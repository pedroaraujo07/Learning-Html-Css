<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Jogador</title>

    <style>

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

    </style>

</head>
<body>
    <h1>Jogador, preencha os campos abaixo:</h1>
    <form action="cadastro.php" autocomplete="on">
        <p><label for="nome">Nome:</label> 
            <input type="text" name="nome" id="nome"></p>
        <p><label for="posicao">Posição:</label> 
            <input type="text" name="posicao" id="posicao"></p>
        <p><label for="idade">Idade:</label> 
            <input type="number" name="idade" id="idade"></p>
        <p><input type="submit" value="Enviar"></p>
    </form>
</body>
</html>
