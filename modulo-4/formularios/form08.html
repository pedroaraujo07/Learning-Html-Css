<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Soma</title>

    <style>

        body {
            font-family: Arial, Helvetica, sans-serif
        }

    </style>

</head>
<body>
    <h1>Formulário Mágico (Somador)</h1>
    <form action="cadastro.php" method="post">

        <p>
            <label for="n1">Número 1: </label>
            <input type="number" name="n1" id="n1" max="11" min="1" placeholder="1-11" required oninput="soma.innerHTML = Number(n1.value) + Number(n2.value)">
        </p>

        <p>
            <label for="n2">Número 2: </label>
            <input type="number" name="n2" id="n2" max="11" min="1" placeholder="1-11" required oninput="soma.innerHTML = Number(n1.value) + Number(n2.value)">
        </p>

        <p>
            <label for="soma">Soma: </label>
            <output name="soma" id="soma">0</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
