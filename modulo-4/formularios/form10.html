<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Idade</title>
</head>
<body>
    <h1>Calculadora de Idade</h1>
    <form action="cadastro.php" method="post">

        <p>
            <label for="ano">Ano que você nasceu: </label>
            <input type="number" name="ano" id="ano" min="0" max="2026" required oninput="idade.innerHTML = Number(2026) - Number(ano.value)">
        </p>

        <p>
            <label for="idade">Sua idade no fim do ano: </label>
            <output name="idade" id="idade">-</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
