<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        body {
            font-family: Arial, Helvetica, sans-serif
        }

    </style>

</head>
<body>
    <h1>A</h1>
    <form action="cadastro.php" method="post">

        <p>
            <label for="cor"> Sua cor favorita:</label>
            <input type="color" name="cor" id="cor" value="#0000ff">
        </p>

        <p>
            <label for="felicidade"> Seu nível de felicidade agora:</label>
            <input type="range" name="felicidade" id="felicidade" min="0" max="10" value="10" >
        </p>

        <p>
            <label for="foto"> Uma foto bonita que você tirou:</label>
            <input type="file" name="foto" id="foto">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
