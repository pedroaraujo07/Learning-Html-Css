<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Jogadores</title>

    <style>

        div.conteiner {
            background-color: rgb(163, 123, 190);
            display: flex;
            margin-top: 150px;
        }

        div.item {
            background-color: lightgray;
            border: 1px solid black;
            flex-basis: 200px;
            text-align: center;
            flex-shrink: 1;
            flex-grow: 1;
        }

        div#adeyemi {
            flex-grow: 0;
            flex-shrink: 2;
        }

        div#bellingham {
            flex-grow: 2;
            flex-shrink: 0;
        }

        div#casemiro {
            flex-grow: 1;
            flex-shrink: 1;
        }

    </style>

</head>
<body>
    <div class="conteiner">
        <div class="item" id="adeyemi">Adeyemi</div>
        <div class="item" id="bellingham">Bellingham</div>
        <div class="item" id="casemiro">Casemiro</div>
    </div>
</body>
</html>
