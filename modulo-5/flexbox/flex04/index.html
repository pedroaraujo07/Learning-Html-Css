<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Jogadores</title>

    <style>

        div.conteiner {
            height: 50px;
            background-color: rgb(163, 123, 190);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        div.item {
            background-color: lightgray;
            border: 1px solid black;
            text-align: center;
            padding: 2px;
        }

    </style>

</head>
<body>
    <div class="conteiner">
        <div class="item">Adeyemi</div>
        <div class="item">Bellingham</div>
        <div class="item">Casemiro</div>
        <div class="item">Danilo</div>
        <div class="item">Estevão</div>
        <div class="item">Fernandinho</div>
        <div class="item">Griezmann</div>
        <div class="item">Haaland</div>
    </div>
</body>
</html>
