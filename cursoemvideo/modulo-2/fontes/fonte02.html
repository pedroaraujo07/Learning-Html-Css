<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Fonts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');

        body {
            font-family: "Playfair Display", serif;
            font-weight: 400;
        }

        h1 {
            font-family: "Caveat", "Playfair Display", serif;
            font-size: 2.5em;
            font-weight: 700;
        }

        h2 {
            font-family: "Caveat", "Playfair Display", serif;
            font-size: 2em;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <h1>Algumas fontes famosas</h1>
    <p>Fontes de informação são muito importante para pesquisas e conhecimento em geral. A seguir vou apresentar algumas das fontes mais conhecidas no Brasil: </p>
    <h2>Wikipedia</h2>
    <p>A Wikipedia é famosa por ser livre e qualquer pessoa poder contribuir para o seu conteúdo.</p>
    
</body>
</html>
