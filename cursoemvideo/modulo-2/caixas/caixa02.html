<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFC Grouping Tags</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(93, 93, 93);
            margin: 0px;
        }

        header {
            background-color: white;
            padding: 1px 10px 10px 10px;
            margin: 10px;
            text-align: center;
        }

        h1 {
            box-shadow: inset 0px 0px 7px 0px rgba(0, 0, 0, 0.504);
        }

        nav {
            background-color: rgb(92, 92, 92);
            padding: 5px 0;
            box-shadow: 5px 3px 7px 1px rgba(0, 0, 0, 0.493);
        }

        nav > a {
            text-decoration: none;
            font-weight: bold;
            margin: 0 50px;
            color: black;
        }

        nav > a:hover {
            color: red;
        }

        main {
            background-color: white;
            padding: 2px 10px 12px 10px;
            margin: 10px;
            border-radius: 0 7px;
            box-shadow: 2px 2px 7px 0px rgba(0, 0, 0, 0.493);
        }

        article {
            background-color: lightgray;
            border: 1px solid black;
            padding: 0 0 0 9px;
        }

        article > aside {
            background-color: rgb(241, 241, 241);
            text-align: center;
        }

        footer {
            background-color: black;
            color: whitesmoke;
            text-align: center;
            padding: 5px 0;
        }

        footer > p {
            margin: 0;
        }

        #bola {
            width: 100px;
            height: 100px;
            background-color: rgb(0, 0, 0);
            border-radius: 50%;
            margin: 70px auto;
        }

    </style>
</head>
<body>
    <header>
        <h1>UFC</h1>
        <nav>
            <a href="#">Link</a>
            <a href="#">Link</a>
            <a href="#">Link</a>
            <a href="#">Link</a>
        </nav>
    </header>
    <main>
        <section id="ranking">
            <h2>Ranking UFC</h2>
            <h3>Peso Leve</h3>
            <ol>
                <li>Ilia Topuria</li>
            </ol>
        </section>
        <section id="cards">
            <article>
                <h2>Cards UFC</h2>
                <p>O card do UFC é o grupo de lutas que acontecerá em um evento específico. São numerados, podendo ser normal ou fight night.</p>
                <aside>
                    <p>Artigo escrito por Dana White</p>
                </aside>
            </article>
        </section>
    </main>
    <footer>
        <p>Site desenvolvido por: Pedro Araújo</p>
    </footer>
    <div id="bola">
        
    </div>
</body>
</html>
