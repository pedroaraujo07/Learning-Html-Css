<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <style>

        table {
            font-family: Arial, Helvetica, sans-serif;
            margin: auto;
            border-collapse: collapse;
            margin-top: 5em;
            width: 80vw;
        }

        caption {
            font-size: large;
            margin-bottom: 1em;
        }

        td, th {
            border: 1px solid black;
            padding: 0.4em;
        }

        #nome {
            background-color: whitesmoke;
        }

        #sexo {
            background-color: pink;
        }

        #idade {
            background-color: azure;
        }

        #profissao {
            background-color: gainsboro;
        }

    </style>

</head>
<body>
    <table>
        <caption>Cadastro</caption>
        <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Sexo</th>
                <th scope="col">Idade</th>
                <th scope="col">Profissão</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Pedro</td>
                <td>M</td>
                <td>18</td>
                <td>Dev</td>
            </tr>
            <tr>
                <td>Marina</td>
                <td>F</td>
                <td>18</td>
                <td>Advogada</td>
            </tr>
            <tr>
                <td>Vitor Lo</td>
                <td>M</td>
                <td>24</td>
                <td>Youtuber</td>
            </tr>
            <tr>
                <td>Victor Lunardi</td>
                <td>M</td>
                <td>27</td>
                <td>Tiktok Streamer</td>
            </tr>
            <tr>
                <td>Neymar Jr</td>
                <td>M</td>
                <td>34</td>
                <td>Jogador de Futebol</td>
            </tr>
            <tr>
                <td>Virgínia</td>
                <td>F</td>
                <td>23</td>
                <td>Digital Influencer</td>
            </tr>
        </tbody>
        <colgroup>
            <col id="nome">
            <col id="sexo">
            <col id="idade">
            <col id="profissao">
        </colgroup>
    </table>
</body>
</html>
