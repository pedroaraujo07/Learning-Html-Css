<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Boxes</title>
</head>

<style>

    #container {
        background-color: blueviolet;
        background-image: url("imgs/target001.png");
        background-size: 100% 100%;
        height: 95vh;
        padding: 10px;
        position: relative;
    }

    #conteudo {
        height: 200px;
        width: 400px;
        background-color: yellow;
        background-image: url("imgs/target001.png");
        background-size: 100% 100%;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
    }

</style>

<body>
    <section id="container">
        <article id="conteudo">

        </article>
    </section>
    
</body>
</html>
