<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Arrasta</title>
</head>
<body>
    <h1>Formulário Arrasta</h1>
    <form action="cadastro.php" method="post">
        
        <p>
            <label for="num">Número: </label>
            <input type="range" name="num" id="num" min="1" max="11" oninput="n.innerHTML = Number(num.value)">

            <output name="n" id="n">6</output>
            
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
