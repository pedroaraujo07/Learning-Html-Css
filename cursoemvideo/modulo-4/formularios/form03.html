<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curiosidades dos Seguidores</title>
    
    <style>

        body {
            font-family: Arial, Helvetica, sans-serif
        }

    </style>

</head>
<body>
    <h1>Curiosidades dos Seguidores</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <p>
            <label for="nome">Nome Completo:</label>
            <input type="text" name="nome" id="nome" required autocomplete="name" maxlength="40" minlength="4" size="34">
        </p>

        <p>
            <label for="num">Número Favorito:</label>
            <input type="number" name="num" id="num" required autocomplete="off" size="5" max="1000" min="0" placeholder="0-1000">
        </p>

        <p>
            <label for="mes">Mês Especial: </label>
            <input type="month" name="mes" id="mes" autocomplete="off">
        </p>

        <p>
            <label for="dia">Dia Especial: </label>
            <input type="date" name="dia" id="dia" autocomplete="off">
        </p>

        <p>
            <label for="hora">Horário Favorito: </label>
            <input type="time" name="hora" id="hora" autocomplete="off">
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>

    </form>
</body>
</html>
