<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Jogadores</title>

    <style>

        div.conteiner {
            background-color: rgb(163, 123, 190);
            display: flex;
        }

        div.item {
            background-color: lightgray;
            border: 1px solid black;
            flex: auto;
            text-align: center;
        }

    </style>

</head>
<body>
    <div class="conteiner">
        <div class="item" style="order: 4;">Adeyemi</div>
        <div class="item" style="order: 2;">Bellingham</div>
        <div class="item" style="order: 5;">Casemiro</div>
        <div class="item" style="order: 7;">Danilo</div>
        <div class="item" style="order: 3;">Estevão</div>
        <div class="item" style="order: 8;">Fernandinho</div>
        <div class="item" style="order: 6;">Griezmann</div>
        <div class="item" style="order: 1;">Haaland</div>
    </div>
</body>
</html>
